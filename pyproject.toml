[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openspec-workflow-spike"
version = "0.5.0"
description = "Local OpenSpec Workflow Orchestrator prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
workflow = "workflow_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
